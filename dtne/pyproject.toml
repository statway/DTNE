[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dtne"
dynamic = ["version"]
description = "Diffusive Topology Neighbor Embedding for single-cell data analysis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Jiangyong Wei", email = "weijy026a@outlook.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
]

[project.optional-dependencies]
visualization = ["matplotlib", "umap-learn"]
single-cell = ["anndata", "graphtools", "scanpy"]
clustering = ["scikit-learn-extra"]
all = [
  "anndata",
  "graphtools",
  "matplotlib",
  "scanpy",
  "scikit-learn-extra",
  "umap-learn",
]
test = ["matplotlib", "pandas"]

[project.urls]
Homepage = "https://github.com/statway/DTNE"
Documentation = "https://dtne.readthedocs.io/"

[tool.setuptools]
packages = ["dtne"]
package-dir = { dtne = "." }
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "dtne._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
